[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "tickforge"
version = "0.1.0"
description = "A C++ limit order book and matching engine, an agent-based market simulator, and an honest study of market-making strategies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agastya Chavan" }]
keywords = ["market-making", "order-book", "matching-engine", "hft", "avellaneda-stoikov", "quant"]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/acftw/tickforge"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
tickforge = "tickforge.cli:main"

[tool.scikit-build]
wheel.packages = ["python/tickforge"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
TICKFORGE_BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905"]
